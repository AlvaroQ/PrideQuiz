import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

buildscript {
    repositories {
        mavenCentral()
        mavenLocal()
        google()
    }
    ext.names = [
            'applicationId': "com.quiz.pride"
    ]
    ext.versions = [
            'compileSdk'        : 36,
            'minSdk'            : 26,
            'targetSdk'         : 36,
            'name'              : '3.0.0',
            'code'              : 50,
            'buildtoolsVersion' : '30.0.2',
    ]

    // Nota: el Version Catalog (libs.*) NO está disponible dentro de buildscript {}.
    // Las versiones de classpath se mantienen hardcodeadas — es la limitacion de Gradle con Groovy DSL.
    dependencies {
        classpath "com.google.gms:google-services:4.4.4"
        classpath "com.google.firebase:firebase-crashlytics-gradle:3.0.6"
        classpath 'com.android.tools.build:gradle:9.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.3.20"
        classpath "org.jetbrains.kotlin:kotlin-serialization:2.3.20"
        classpath "io.github.takahirom.roborazzi:roborazzi-gradle-plugin:1.59.0"
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

tasks.withType(KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
    }
}
