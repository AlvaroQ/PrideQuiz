import groovy.xml.XmlParser

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'io.github.takahirom.roborazzi'

android {
    compileSdk versions.compileSdk

    signingConfigs {
        config {
            keyAlias PRIDEQUIZ_RELEASE_KEY_ALIAS
            keyPassword PRIDEQUIZ_RELEASE_KEY_PASSWORD
            storeFile file(PRIDEQUIZ_RELEASE_STORE_FILE)
            storePassword PRIDEQUIZ_RELEASE_STORE_PASSWORD
        }
    }

    defaultConfig {
        applicationId names.applicationId
        minSdk versions.minSdk
        targetSdk versions.targetSdk
        versionCode versions.code
        versionName versions.name
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            jniDebuggable = true
            debuggable = true
            minifyEnabled = false
            firebaseCrashlytics {
                mappingFileUploadEnabled = false
            }

            resValue 'string', 'admob_app_id', getAdmobAppId()
            resValue 'string', 'BANNER_GAME', getAdmobBannerTestId()
            resValue 'string', 'BANNER_RANKING', getAdmobBannerTestId()
            resValue 'string', 'BANNER_INFO', getAdmobBannerTestId()
            resValue 'string', 'BANNER_PREFERENCES', getAdmobBannerTestId()
            resValue 'string', 'BANNER_MORE_APPS', getAdmobBannerTestId()

            resValue 'string', 'BONIFICADO_GAME', getAdmobBonificadoTestId()
            resValue 'string', 'BONIFICADO_GAME_OVER', getAdmobBonificadoTestId()
            resValue 'string', 'BONIFICADO_SHOW_INFO', getAdmobBonificadoTestId()
            enableUnitTestCoverage = true
            enableAndroidTestCoverage = true
        }
        release {
            signingConfig = signingConfigs.config
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable = false
            firebaseCrashlytics {
                mappingFileUploadEnabled = true
            }

            resValue 'string', 'admob_app_id', getAdmobAppId()
            resValue 'string', 'BANNER_GAME', getAdmobBannerGameId()
            resValue 'string', 'BANNER_RANKING', getAdmobBannerRankingId()
            resValue 'string', 'BANNER_INFO', getAdmobBannerInfoId()
            resValue 'string', 'BANNER_PREFERENCES', getAdmobBannerPreferencesId()
            resValue 'string', 'BANNER_MORE_APPS', getAdmobBannerMoreAppsId()

            resValue 'string', 'BONIFICADO_GAME', getAdmobBonificadoGameId()
            resValue 'string', 'BONIFICADO_GAME_OVER', getAdmobBonificadoGameOverId()
            resValue 'string', 'BONIFICADO_SHOW_INFO', getAdmobBonificadoShowInfoId()
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }
    buildFeatures {
        compose = true
        buildConfig = true
        resValues = true
    }

    ndkVersion = "27.0.12077973"

    buildTypes.release {
        ndk { debugSymbolLevel 'FULL' }
    }

    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    namespace = 'com.quiz.pride'

    packaging {
        resources {
            excludes += ['META-INF/LICENSE.md', 'META-INF/LICENSE-notice.md']
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            // Aislar cada test class en su propia JVM. Evita test pollution entre
            // clases por estado global compartido (mockk proxies, Flows en coroutines
            // no canceladas, Dispatchers.Main sin resetear). Coste: suite mas lenta
            // pero los tests son deterministas y reproducibles.
            all {
                forkEvery = 1
            }
        }
    }
}

