// APPLICATION ID (same for debug and release)
def getAdmobAppId() {
    try {
        def stringsFile = file("./secrets/secrets.xml")
        return new XmlParser().parse(stringsFile).string.find { it.@name.equals 'admob_id' }.text()
    } catch(e) {
        println(e)
        return ""
    }
}

