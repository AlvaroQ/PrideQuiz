name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Placeholders for release signing. We never build release in CI — debug
      # doesn't use these — but Gradle evaluates the signingConfigs block at
      # configure time, so the properties must exist or configuration fails.
      - name: Inject CI signing placeholders
        run: |
          cat >> gradle.properties <<'EOF'

          PRIDEQUIZ_RELEASE_KEY_ALIAS=ci
          PRIDEQUIZ_RELEASE_KEY_PASSWORD=ci
          PRIDEQUIZ_RELEASE_STORE_FILE=ci-dummy.jks
          PRIDEQUIZ_RELEASE_STORE_PASSWORD=ci
          EOF

      # The google-services plugin requires this file at build time even for
      # JVM unit tests. The values are structurally valid but non-functional —
      # CI never makes real Firebase calls.
      - name: Generate stub google-services.json
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "pridequiz-ci",
              "storage_bucket": "pridequiz-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.quiz.pride" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKeyForCIBuildOnly00000000000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
