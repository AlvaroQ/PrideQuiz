[versions]
# ==========================================
# BUILD TOOLS
# ==========================================
agp = "9.1.1"
kotlin = "2.3.20"

# ==========================================
# ANDROID SDK
# ==========================================
compileSdk = "36"
minSdk = "26"
targetSdk = "36"

# ==========================================
# APP VERSION
# ==========================================
appVersionName = "3.0.0"
appVersionCode = "55"

# ==========================================
# KOTLIN & COROUTINES
# ==========================================
coroutines = "1.10.2"
kotlinxSerialization = "1.11.0"

# ==========================================
# ANDROIDX CORE
# ==========================================
androidxCore = "1.18.0"
appcompat = "1.7.1"
datastore = "1.2.1"
workManager = "2.11.2"

# ==========================================
# LIFECYCLE
# ==========================================
lifecycle = "2.10.0"

# ==========================================
# NAVIGATION
# ==========================================
navigation = "2.9.7"

# ==========================================
# COMPOSE
# ==========================================
composeBom = "2026.03.01"
activityCompose = "1.13.0"
# Override puntual del BOM para acceder a APIs de Material 3 Expressive Motion Theming
# (MaterialExpressiveTheme, MotionScheme, Shapes.largeIncreased). En material3:1.4.0 del
# BOM 2026.03.01 esas APIs figuran documentadas pero estan empaquetadas como `internal`.
# Desde 1.5.0-alpha01+ estan expuestas publicamente con @ExperimentalMaterial3ExpressiveApi.
material3Expressive = "1.5.0-alpha17"

# ==========================================
# DEPENDENCY INJECTION (KOIN)
# ==========================================
koin = "4.2.1"

# ==========================================
# FIREBASE
# ==========================================
firebaseBom = "34.12.0"
googleServices = "4.4.4"
firebaseCrashlyticsGradle = "3.0.7"

# ==========================================
# ADS & BILLING
# ==========================================
admob = "25.2.0"
billing = "8.3.0"
ump = "4.0.0"

# ==========================================
# IMAGE LOADING
# ==========================================
coil = "3.4.0"


# ==========================================
# NETWORKING
# ==========================================
# okhttp = "4.12.0"    # Eliminado: no se usa Retrofit en el proyecto
# retrofit = "2.9.0"   # Eliminado: no se usa Retrofit en el proyecto

# ==========================================
# UTILITIES
# ==========================================
arrow = "2.2.2.1"
timber = "5.0.1"

# ==========================================
# SECURITY
# ==========================================
securityCrypto = "1.1.0"
guava = "9999.0-empty-to-avoid-conflict-with-guava"

# ==========================================
# QUALITY TOOLS
# ==========================================
roborazzi = "1.59.0"
robolectric = "4.16.1"

# ==========================================
# TESTING
# ==========================================
mockk = "1.14.9"
turbine = "1.2.1"
junit = "4.13.2"
androidxTestExt = "1.3.0"


[libraries]
# ==========================================
# BUILD-LOGIC — Gradle Plugin dependencies (usadas en build-logic como compileOnly)
# ==========================================
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

# ==========================================
# KOTLIN & COROUTINES
# ==========================================
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# ==========================================
# ANDROIDX CORE
# ==========================================
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# ==========================================
# LIFECYCLE
# ==========================================
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# ==========================================
# NAVIGATION
# ==========================================
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# ==========================================
# COMPOSE (BOM + libs sin version — gestionadas por BOM)
# ==========================================
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3Expressive" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Debug
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }

# ==========================================
# DEPENDENCY INJECTION (KOIN)
# ==========================================
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }

# ==========================================
# FIREBASE (BOM + libs sin version — gestionadas por BOM)
# ==========================================
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-database = { group = "com.google.firebase", name = "firebase-database" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
guava-listenablefuture = { group = "com.google.guava", name = "listenablefuture", version.ref = "guava" }

# ==========================================
# ADS & BILLING
# ==========================================
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "admob" }
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }
ump = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "ump" }

# ==========================================
# IMAGE LOADING
# ==========================================
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# ==========================================
# UTILITIES
# ==========================================
arrow-core = { group = "io.arrow-kt", name = "arrow-core", version.ref = "arrow" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# ==========================================
# SECURITY
# ==========================================
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# ==========================================
# QUALITY TOOLS
# ==========================================
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# ==========================================
# TESTING
# ==========================================
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin" }
koin-test-junit4 = { group = "io.insert-koin", name = "koin-test-junit4", version.ref = "koin" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsGradle" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
